# Default values for kan-brewer.

# Kanister namespace: this is where blueprints are, and this is where the actionsets will be created
kanisterNamespace: "kanister"

# How many successful actionsets to keep (older successful actionsets will be deleted)
keepSuccessfulActionsets: 3

image:
  repository: ghcr.io/haimgel/kan-brewer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccountAnnotations: {}
jobAnnotations: {}
jobLabels: {}
podAnnotations: {}
podLabels: {}

# Defaults satisfy PodSecurity "restricted". Overrides merge key by key; set a key to null to drop it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532 # the image's USER
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

cronJob:
  schedule: "30 1 */1 * *" # 1:30 AM every day
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  backoffLimit: 0
  restartPolicy: Never
  ttlSecondsAfterFinished: 86400 # 1 day
  # Limit for one run, image pull included. Kanister runs the backups afterwards, so a run itself takes seconds.
  activeDeadlineSeconds: 600

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
